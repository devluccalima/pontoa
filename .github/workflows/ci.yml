name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: pontoa
          POSTGRES_PASSWORD: pontoa-ci
          POSTGRES_DB: pontoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pontoa -d pontoa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PONTOA_TEST_DATABASE_URL: postgresql+psycopg://pontoa:pontoa-ci@localhost:5432/pontoa_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Instalar dependências (lockfile)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      # Inclui o teste que compara docs/api/openapi.json com a API.
      - name: Testes
        run: pytest

      - name: Modelos sem migração
        env:
          PONTOA_DATABASE_URL: ${{ env.PONTOA_TEST_DATABASE_URL }}
        run: alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tipos da API atualizados
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: Imagem da API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: pontoa
          POSTGRES_PASSWORD: pontoa-ci
          POSTGRES_DB: pontoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pontoa -d pontoa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pontoa:pontoa-ci@localhost:5432/pontoa
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t pontoa-api:ci backend

      - name: Migrações dentro da imagem
        run: >-
          docker run --rm --network host
          -e PONTOA_ENVIRONMENT=production
          -e PONTOA_DATABASE_URL="$DATABASE_URL"
          pontoa-api:ci alembic upgrade head

      - name: API responde com acesso ao banco
        run: |
          docker run -d --name api --network host \
            -e PONTOA_ENVIRONMENT=production \
            -e PONTOA_DATABASE_URL="$DATABASE_URL" \
            pontoa-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
